name: Publish

on:
  push:
    branches:
      - main
      - master

jobs:
  publish_npm:
    # Fork merges must not publish the upstream npm package.
    if: github.repository == 'Twiyin0/koishi-plugin-minecraft-sync-msg'
    permissions:
      id-token: write
      contents: read
    uses: koikirin/buildplate/.github/workflows/publish_npm.buildplate.yml@v1
